[project]
name = "evm-project-tool"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic>=2",
    "psycopg[binary,pool]==3.2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.3",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evm_project_tool"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests requiring PostgreSQL",
]

# verify: uv run pytest tests/unit tests/integration --cov=evm_project_tool.domain --cov=evm_project_tool.application --cov-fail-under=80 && uv run ruff check src/ && uv run ruff format --check src/
